kind: HTTPRoute
metadata:
  name: apim-wso2am-all-in-one-gateway-httproute
  namespace: apim
spec:
  parentRefs:
  - name: wso2-apim-gateway
    sectionName: gateway-https
  hostnames:
  - gw.wso2.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: apim-wso2am-all-in-one-am-service
      port: 8243
