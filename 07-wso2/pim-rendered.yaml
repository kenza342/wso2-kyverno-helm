data:
  deployment.toml: "[server]\nhostname = \"am.wso2.com\"\nnode_ip = \"$env{NODE_IP}\"\noffset = 0\nbase_path = \"${carbon.protocol}://${carbon.host}:${carbon.management.port}\"\n#discard_empty_caches = false\nserver_role = \"default\"\n\n[user_store]\n#type = \"database_unique_id\"\ntype = \"database_unique_id\"\n\n[super_admin]\nusername = \"admin\"\npassword = \"$env{WSO2_ADMIN_PASSWORD}\"\ncreate_admin_account = true\n\n#[4database.apim_db]\n#type = \"h2\"\n#url = \"jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE\"\n#username = \"wso2carbon\"\n#password = \"wso2carbon\"\n#driver = \"org.h2.Driver\"\n[database.apim_db]\ntype = \"mysql\"\nurl = \"jdbc:mysql://mysql-svc.database.svc.cluster.local:3306/apim_db?useSSL=false&allowPublicKeyRetrieval=true\"\nusername = \"wso2carbon\"\npassword = \"ChangeMe_Wso2!\"\ndriver = \"com.mysql.cj.jdbc.Driver\"\n#type = \"mysql\"\n#url = \"jdbc:mysql://mysql-svc.database.svc.cluster.local:3306/apim_db?useSSL=false&allowPublicKeyRetrieval=true\"\n#username = \"wso2carbon\"\n#\n#password = \"ChangeMe_Wso2!\"\n#\n#driver = \"com.mysql.cj.jdbc.Driver\"\n\n[database.apim_db.pool_options]\ndefaultAutoCommit = \"true\"\nmaxActive = \"100\"\nmaxWait = \"60000\"\nminIdle = \"5\"\ntestOnBorrow = \"true\"\ntestWhileIdle = \"true\"\nvalidationInterval = \"30000\"\n\n[database.shared_db]\ntype = \"mysql\"\nurl = \"jdbc:mysql://mysql-svc.database.svc.cluster.local:3306/shared_db?useSSL=false&allowPublicKeyRetrieval=true\"\nusername = \"wso2carbon\"\npassword = \"ChangeMe_Wso2!\"\ndriver = \"com.mysql.cj.jdbc.Driver\"\n\n[database.shared_db.pool_options]\ndefaultAutoCommit = \"true\"\nmaxActive = \"100\"\nmaxWait = \"60000\"\nminIdle = \"5\"\ntestOnBorrow = \"true\"\ntestWhileIdle = \"true\"\nvalidationInterval = \"30000\"\n\n[apim]\ngateway_type = \"Regular,APK,AWS,Azure,Kong\"\n\n[keystore]\n[keystore.tls]\ntype = \"JKS\"\nfile_name = \"wso2carbon.jks\"\nalias = \"wso2carbon\"\npassword = \"wso2carbon\"\nkey_password = \"ws