apiVersion: apps/v1
kind: Deployment
metadata:
  name: apim-wso2am-all-in-one-am-deployment-1
  namespace: apim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      deployment: apim-wso2am-all-in-one-am
      node: apim-wso2am-all-in-one-am-1
  template:
    metadata:
      annotations:
        checksum.am.conf: 39a1778959e8b56e0602b073013abffe38b3c807903ae00edaa8cb05ad29d287
        checksum.am.conf.log4j2: fa21dfd411e20e2311259f13dd2816dc268a8fdc84b1acb133e3dfc239657e5b
        checksum.am.conf.secret-conf: 6931efed2d9b235c16cb2483d011065a68d48e84e9adb262621f41a66645fbfb
      labels:
        deployment: apim-wso2am-all-in-one-am
        node: apim-wso2am-all-in-one-am-1
        product: apim
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: deployment
                  operator: In
                  values:
                  - apim-wso2am-all-in-one
              topologyKey: "topology.kubernetes.io/zone"
            weight: 100
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: "10.99.240.42"
          hostnames:
            - "am.wso2.com"
      containers:
        - name: wso2am
          command:
            - /bin/bash
            - /home/wso2carbon/docker-entrypoint.sh
          image: docker.io/wso2am:4.7.0-mysql

          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JVM_MEM_OPTS
              value: "-Xms2048m -Xmx2048m"
            - name: WSO2_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apim-creds
                  key:  adminPassword
            - name: WSO2_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: apim-creds
                  key:  encryptionKey
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - timeout 1 bash -c "</dev/tcp/localhost/9443"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /services/Version
              port: 9763
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/am/gateway/v2/server-startup-healthcheck
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - >
                    echo "Pre stop hook triggered";
                    sleep 10;
                    echo "Shutdown APIM Server";
                    ${WSO2_SERVER_HOME}/bin/api-manager.sh stop
          resources:
            requests:
              memory: 2Gi
              cpu: 2000m
            limits:
              memory: 3Gi
              cpu: 3000m
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8280
              protocol: "TCP"
            - containerPort: 8243
              protocol: "TCP"
            - containerPort: 9763
              protocol: "TCP"
            - containerPort: 9443
              protocol: "TCP"
            - containerPort: 9711
              protocol: "TCP"
            - containerPort: 9611
              protocol: "TCP"
            - containerPort: 5672
              protocol: "TCP"
          volumeMounts:
            - name: wso2am-conf
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
              subPath: deployment.toml
           # - name: wso2am-entrypoint
            #  mountPath: /home/wso2carbon/docker-entrypoint.sh
            #  subPath: docker-entrypoint.sh
            - name: wso2am-log4j2
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/log4j2.properties
              subPath: log4j2.properties
            
      volumes:
        - name: wso2am-conf
          configMap:
            name: apim-wso2am-all-in-one-am-conf-1
            defaultMode: 0407
       # - name: wso2am-entrypoint
         # configMap:
          #  name: apim-wso2am-all-in-one-conf-entrypoint
           # defaultMode: 0755
        - name: wso2am-log4j2
          configMap:
            name: apim-wso2am-all-in-one-conf-log4j2
            defaultMode: 0407
