apiVersion: v1
kind: ConfigMap
metadata:
  name: apim-wso2am-all-in-one-conf-log4j2
  namespace : apim
data:
  log4j2.properties: "# list of all appenders\n#add entry \"syslog\" to use the syslog appender\nappenders = CARBON_CONSOLE, HTTP_ACCESS_CONSOLE, AUDIT_CONSOLE, TRANSACTION_CONSOLE, CORRELATION_CONSOLE, CARBON_LOGFILE, AUDIT_LOGFILE, ATOMIKOS_LOGFILE, CARBON_TRACE_LOGFILE, ERROR_LOGFILE, OPEN_TRACING,SERVICE_APPENDER, TRACE_APPENDER, osgi, CORRELATION, BOTDATA_APPENDER, API_LOGFILE, APIM_GOV_AUDIT_LOGFILE\n\n# CARBON_CONSOLE is set to be a ConsoleAppender using a PatternLayout.\nappender.CARBON_CONSOLE.type = Console\nappender.CARBON_CONSOLE.name = CARBON_CONSOLE\nappender.CARBON_CONSOLE.layout.type = PatternLayout\nappender.CARBON_CONSOLE.layout.pattern = TID: [%X{tenantId}] Tenant: [%X{tenantDomain}] [%d] [%X{Correlation-ID}] : apim : %5p {%c} - %replace{%mm}{\\n}{|}%xThrowable{separator(|)}%n\nappender.CARBON_CONSOLE.filter.threshold.type = ThresholdFilter\nappender.CARBON_CONSOLE.filter.threshold.level = DEBUG\n\nappender.HTTP_ACCESS_CONSOLE.type = Console\nappender.HTTP_ACCESS_CONSOLE.name = HTTP_ACCESS_CONSOLE\nappender.HTTP_ACCESS_CONSOLE.layout.type = PatternLayout\nappender.HTTP_ACCESS_CONSOLE.layout.pattern =  apim-access [%X{Correlation-ID}] %mm%n\nappender.HTTP_ACCESS_CONSOLE.filter.threshold.type = ThresholdFilter\nappender.HTTP_ACCESS_CONSOLE.filter.threshold.level = INFO\n\n# AUDIT_CONSOLE is set to be a ConsoleAppender using a PatternLayout.\nappender.AUDIT_CONSOLE.type = Console\nappender.AUDIT_CONSOLE.name = AUDIT_CONSOLE\nappender.AUDIT_CONSOLE.layout.type = PatternLayout\nappender.AUDIT_CONSOLE.layout.pattern =  TID: [%X{tenantId}] Tenant: [%X{tenantDomain}] [%d] [%X{Correlation-ID}] : apim-audit : %5p {%c} - %replace{%mm}{\\n}{|}%xThrowable{separator(|)}%n\nappender.AUDIT_CONSOLE.filter.threshold.type = ThresholdFilter\nappender.AUDIT_CONSOLE.filter.threshold.level = DEBUG\n\n# TRANSACTION_CONSOLE is set to be a ConsoleAppender using a PatternLayout.\nappender.TRANSACTION_CONSOLE.type = Console\nappender.TRANSACTION_CONSOLE.name = TRANSACTION_CONSOLE\nappender.TRANSACTION_CONSOLE.layout.type = PatternLayout\nappender.TRANSACTION_CONSOLE.layout.pattern =  TID: [%X{tenantId}] [%d] [%X{Correlation-ID}] : apim-transaction : {%c} - %mm %n\nappender.TRANSACTION_CONSOLE.filter.threshold.type = ThresholdFilter\nappender.TRANSACTION_CONSOLE.filter.threshold.level = DEBUG\n\n# CORRELATION_CONSOLE is set to be a ConsoleAppender using a PatternLayout.\nappender.CORRELATION_CONSOLE.type = Console\nappender.CORRELATION_CONSOLE.name = CORRELATION_CONSOLE\nappender.CORRELATION_CONSOLE.layout.type = PatternLayout\nappender.CORRELATION_CONSOLE.layout.pattern =  %d{yyyy-MM-dd HH:mm:ss,SSS}|%X{Correlation-ID} : apim-correlation : |%t|%mm%n\nappender.CORRELATION_CONSOLE.filter.threshold.type = ThresholdFilter\nappender.CORRELATION_CONSOLE.filter.threshold.level = DEBUG\n\n# CARBON_LOGFILE is set to be a DailyRollingFileAppender using a PatternLayout.\nappender.CARBON_LOGFILE.type = RollingFile\nappender.CARBON_LOGFILE.name = CARBON_LOGFILE\nappender.CARBON_LOGFILE.fileName = ${sys:carbon.home}/repository/logs/wso2carbon.log\nappender.CARBON_LOGFILE.filePattern = ${sys:carbon.home}/repository/logs/wso2carbon-%d{MM-dd-yyyy}-%i.log.gz\nappender.CARBON_LOGFILE.layout.type = PatternLayout\nappender.CARBON_LOGFILE.layout.pattern = TID: [%tenantId] [%appName] [%d] %5p {%c} - %m%ex%n\nappender.CARBON_LOGFILE.policies.type = Policies\nappender.CARBON_LOGFILE.policies.time.type = TimeBasedTriggeringPolicy\nappender.CARBON_LOGFILE.policies.time.interval = 1\nappender.CARBON_LOGFILE.policies.time.modulate = true\nappender.CARBON_LOGFILE.policies.size.type = SizeBasedTriggeringPolicy\nappender.CARBON_LOGFILE.policies.size.size=1GB\nappender.CARBON_LOGFILE.strategy.type = DefaultRolloverStrategy\nappender.CARBON_LOGFILE.strategy.max = 20\nappender.CARBON_LOGFILE.filter.threshold.type = ThresholdFilter\nappender.CARBON_LOGFILE.filter.threshold.level = DEBUG\n\nappender.CARBON_LOGFILE.strategy.action.type = Delete\nappender.CARBON_LOGFILE.strategy.action.basepath = ${sys:carbon.home}/repository/logs/\nappender.CARBON_LOGFILE.strategy.action.maxdepth = 1\nappender.CARBON_LOGFILE.strategy.action.condition.type = IfLastModified\nappender.CARBON_LOGFILE.strategy.action.condition.age = 14D\nappender.CARBON_LOGFILE.strategy.action.PathConditions.type = IfFileName\nappender.CARBON_LOGFILE.strategy.action.PathConditions.glob = wso2carbon-*\n\n# Appender config API logging\nappender.API_LOGFILE.type = RollingFile\nappender.API_LOGFILE.name = API_LOGFILE\nappender.API_LOGFILE.fileName = ${sys:carbon.home}/repository/logs/api.log\nappender.API_LOGFILE.filePattern = ${sys:carbon.home}/repository/logs/api-%d{MM-dd-yyyy}-%i.log\nappender.API_LOGFILE.layout.type = PatternLayout\nappender.API_LOGFILE.layout.pattern = [%d] %5p {%c} %X{apiName} - %m%ex%n\nappender.API_LOGFILE.policies.type = Policies\nappender.API_LOGFILE.policies.time.type = TimeBasedTriggeringPolicy\nappender.API_LOGFILE.policies.time.interval = 1\nappender.API_LOGFILE.policies.time.modulate = true\nappender.API_LOGFILE.policies.size.type = SizeBasedTriggeringPolicy\nappender.API_LOGFILE.policies.size.size = 10MB\nappender.API_LOGFILE.strategy.type = DefaultRolloverStrategy\nappender.API_LOGFILE.strategy.max = 20\nappender.API_LOGFILE.filter.threshold.type = ThresholdFilter\nappender.API_LOGFILE.filter.threshold.level = DEBUG\n\n# Appender config to AUDIT_LOGFILE\nappender.AUDIT_LOGFILE.type = RollingFile\nappender.AUDIT_LOGFILE.name = AUDIT_LOGFILE\nappender.AUDIT_LOGFILE.fileName = ${sys:carbon.home}/repository/logs/audit.log\nappender.AUDIT_LOGFILE.filePattern = ${sys:carbon.home}/repository/logs/audit-%d{MM-dd-yyyy}-%i.log\nappender.AUDIT_LOGFILE.layout.type = PatternLayout\nappender.AUDIT_LOGFILE.layout.pattern = TID: [%tenantId] [%d] %5p {%c} - %m%ex%n\nappender.AUDIT_LOGFILE.policies.type = Policies\nappender.AUDIT_LOGFILE.policies.time.type = TimeBasedTriggeringPolicy\nappender.AUDIT_LOGFILE.policies.time.interval = 1\nappender.AUDIT_LOGFILE.po