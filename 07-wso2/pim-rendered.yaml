apiVersion: v1
kind: ConfigMap
metadata:
  name: apim-wso2am-all-in-one-conf-entrypoint
data:
  docker-entrypoint.sh: |
    #!/bin/bash
    set -e

    # WSO2 runtime directories
    WORKING_DIRECTORY="${WORKING_DIRECTORY:-/home/wso2carbon}"
    WSO2_SERVER_HOME="${WSO2_SERVER_HOME:-/home/wso2carbon/wso2am-4.7.0}"

    # volume mounts
    config_volume=${WORKING_DIRECTORY}/wso2-config-volume
    artifact_volume=${WORKING_DIRECTORY}/wso2-artifact-volume

    # check if the WSO2 non-root user home exists
    test ! -d "${WORKING_DIRECTORY}" && echo "WSO2 Docker non-root user home does not exist" && exit 1

    # check if the WSO2 product home exists
    test ! -d "${WSO2_SERVER_HOME}" && echo "WSO2 Docker product home does not exist" && exit 1

    # Force the Helm-generated deployment.toml to be active
    if test -f "${config_volume}/repository/conf/deployment.toml"; then
      echo "Using Helm-generated deployment.toml"
      cp -f "${config_volume}/repository/conf/deployment.toml" \
        "${WSO2_SERVER_HOME}/repository/conf/deployment.toml"
    fi

    # Force the Helm-generated log4j2.properties to be active
    if test -f "${config_volume}/repository/conf/log4j2.properties"; then
      echo "Using Helm-generated log4j2.properties"
      cp -f "${config_volume}/repository/conf/log4j2.properties" \
        "${WSO2_SERVER_HOME}/repository/conf/log4j2.properties"
    fi

    # copy artifact changes mounted to artifact_volume
    if test -d "${artifact_volume}" && [[ "$(ls -A "${artifact_volume}")" ]]; then
      cp -RL "${artifact_volume}/." "${WSO2_SERVER_HOME}/"
    fi

    # start WSO2 Carbon server
    sh "${WSO2_SERVER_HOME}/bin/api-manager.sh" "$@"
---
