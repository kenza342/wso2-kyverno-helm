apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnow-backend
  namespace: apim
spec:
  replicas: 1

  selector:
    matchLabels:
      app: shopnow-backend

  template:
    metadata:
      labels:
        app: shopnow-backend
        environment: dev

    spec:
      hostNetwork: false

      securityContext:
        runAsNonRoot: true

      containers:
        - name: backend

          image: shopnow-backend:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              protocol: TCP

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /status/200
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /status/200
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-backend
  namespace: apim
spec:
  selector:
    app: shopnow-backend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
