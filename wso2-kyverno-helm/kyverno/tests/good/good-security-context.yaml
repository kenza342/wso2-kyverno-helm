apiVersion: v1
kind: Pod

metadata:
  name: good-security-context
  namespace: apim

spec:

  securityContext:
    runAsNonRoot: true

  containers:

  - name: nginx

    image: docker.io/nginxinc/nginx-unprivileged:1.29

    securityContext:

      allowPrivilegeEscalation: false

      capabilities:

        drop:
        - ALL
