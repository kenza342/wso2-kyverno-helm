apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-sa
  namespace: wso2-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-role
  namespace: wso2-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update"]
  # PAS de règle sur "pods/exec" -> kubectl exec -it est refusé par défaut
  # PAS de règle sur "secrets" -> lecture des Secrets interdite
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: wso2-dev
subjects:
  - kind: ServiceAccount
    name: developer-sa
    namespace: wso2-dev
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io
