apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-sa
  namespace: wso2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-role
  namespace: wso2
rules:
  - apiGroups: ["", "apps"]
    resources: ["deployments", "services", "configmaps", "secrets", "pods"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-binding
  namespace: wso2
subjects:
  - kind: ServiceAccount
    name: cicd-sa
    namespace: wso2
roleRef:
  kind: Role
  name: cicd-role
  apiGroup: rbac.authorization.k8s.io
