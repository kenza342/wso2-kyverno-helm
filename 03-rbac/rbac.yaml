apiVersion: v1
kind: ServiceAccount
metadata:
  name: wso2-sa
  namespace: wso2

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wso2-role
  namespace: wso2

rules:
- apiGroups: [""]
  resources:
    - pods
    - services
    - configmaps
    - secrets
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wso2-rolebinding
  namespace: wso2

subjects:
- kind: ServiceAccount
  name: wso2-sa
  namespace: wso2

roleRef:
  kind: Role
  name: wso2-role
  apiGroup: rbac.authorization.k8s.io
