apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: require-probes

spec:
  validationFailureAction: Enforce
  background: true

  rules:
  - name: check-probes

    match:
      any:
      - resources:
          kinds:
          - Pod

    validate:
      message: "Les conteneurs doivent définir livenessProbe et readinessProbe."

      foreach:
      - list: "request.object.spec.containers"

        deny:
          conditions:
            any:
            - key: "{{ element.livenessProbe || '' }}"
              operator: Equals
              value: ""

            - key: "{{ element.readinessProbe || '' }}"
              operator: Equals
              value: ""
